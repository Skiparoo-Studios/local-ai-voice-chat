[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "voice-assistant"
version = "0.1.0"
description = "Local-first voice assistant with replaceable speech, language and automation providers"
readme = "README.md"
requires-python = ">=3.12"

# Base dependencies only. Everything model- or protocol-specific lives in an
# optional extra so a machine that only runs one part of the system does not
# have to install the whole stack.
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
tts = [
    # The 'codec' extra pulls torchcodec, which torch 2.9+ requires for audio IO.
    "coqui-tts[codec]>=0.27",
    # coqui-tts 0.27 imports transformers.pytorch_utils.isin_mps_friendly,
    # which transformers 5 removed. Pin until coqui-tts supports 5.x.
    "transformers>=4.43,<5",
    "torch>=2.6",
    "sounddevice>=0.5",
    "numpy>=2.0",
]
# An alternative synthesiser: an ONNX model that loads in two seconds and runs
# faster than real time on a CPU, where XTTS wants a GPU and 26 seconds. It
# cannot clone a voice, which is the trade.
#
# LICENCE: piper-tts is GPL-3.0-or-later, because it bundles espeak-ng as its
# phonemiser. That is a copyleft obligation on distributing a combined work.
# Unlike the CPML that covers XTTS-v2, it places no restriction on use or on
# the audio produced. Kept in its own extra so that installing this project
# does not pull GPL code unless you ask for it. See NOTICE.md.
piper = [
    "piper-tts>=1.3",
    "sounddevice>=0.5",
    "numpy>=2.0",
]
stt = [
    "faster-whisper>=1.2",
    "sounddevice>=0.5",
    "numpy>=2.0",
    # Capture devices rarely offer 16 kHz natively; soxr resamples to what
    # Whisper expects without the aliasing that naive decimation introduces.
    "soxr>=0.5",
]
llm = [
    "httpx>=0.28",
]
wake = [
    # Apache-2.0, runs on onnxruntime, ships pretrained wake words and needs
    # no account or key. Porcupine is the alternative but requires both.
    "openwakeword>=0.6",
    "silero-vad>=5.1",
    "onnxruntime>=1.18",
    "numpy>=2.0",
    "sounddevice>=0.5",
]
# A machine that is only a microphone and a speaker for an assistant running
# elsewhere. Deliberately not the 'wake' extra: that pulls silero-vad, which
# depends on torch and torchaudio unconditionally, and PyTorch on a Raspberry
# Pi is hundreds of megabytes to do a job the energy detector does for nothing.
# Neither Whisper nor XTTS is here either --- the server does all of that.
client = [
    "websockets>=14.0",
    "sounddevice>=0.5",
    "numpy>=2.0",
    # Capture devices rarely offer 16 kHz natively, and a USB microphone on a
    # Pi almost never does.
    "soxr>=0.5",
    # Only needed for a wake word. Set wakeWord.provider to "always-awake" and
    # this goes unused, which is the right choice for a headset.
    "openwakeword>=0.6",
]

# Reading books aloud. soundfile decodes an audiobook in blocks, so a
# seventy-two minute chapter never sits in memory. Text books need whatever
# text-to-speech provider is configured and nothing more.
books = [
    "soundfile>=0.12",
    "numpy>=2.0",
]

automation = [
    "httpx>=0.28",
    "paho-mqtt>=2.1",
]
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "websockets>=14.0",
    # Required by FastAPI for the audio upload on /speech/transcribe.
    "python-multipart>=0.0.9",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: requires models, hardware or network (deselect with '-m \"not integration\"')",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF", "BLE"]
# The project brief mandates lowerCamelCase method and variable names. That
# conflicts with pep8-naming, so the relevant rules are disabled deliberately
# rather than worked around case by case.
ignore = [
    "N802",  # function name should be lowercase
    "N803",  # argument name should be lowercase
    "N806",  # variable in function should be lowercase
    "N815",  # mixedCase variable in class scope
    "N816",  # mixedCase variable in global scope
    "N999",  # invalid module name (the brief's structure uses camelCase files)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B018"]
